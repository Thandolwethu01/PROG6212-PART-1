name: RaceDay3 Database CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:

  database-test:

    name: Test RaceDay Database

    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "RaceDayPassword123!"
        ports:
          - 1433:1433

    steps:

      # Step 1: Download the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Step 2: Install SQL Server command-line tools
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | \
            sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH


      # Step 3: Wait for SQL Server
      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server..."

          for i in {1..30}
          do
            /opt/mssql-tools18/bin/sqlcmd \
              -S localhost,1433 \
              -U sa \
              -P "RaceDayPassword123!" \
              -C \
              -Q "SELECT 1" && break

            echo "SQL Server is not ready yet..."
            sleep 2
          done


      # Step 4: Create database and tables
      - name: Run RaceDay database script
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "RaceDayPassword123!" \
            -C \
            -i database/RaceDay.sql


      # Step 5: Run database tests
      - name: Run database tests
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "RaceDayPassword123!" \
            -C \
            -d RaceDay \
            -i tests/test.sql


      # Step 6: Confirm successful pipeline
      - name: Database CI completed
        run: |
          echo "======================================"
          echo "RaceDay3 Database CI PASSED"
          echo "======================================"
