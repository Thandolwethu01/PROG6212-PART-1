name: RaceDay3 Database CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  database-test:
    name: Test RaceDay Database
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'RaceDayPassword123!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RaceDayPassword123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Step 1: Download the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install SQL Server command-line tools safely
      - name: Install SQLCMD
        run: |
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      # Step 3: Verify SQL Server availability
      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server to be fully responsive..."
          for i in {1..30}; do
            /opt/mssql-tools18/bin/sqlcmd \
              -S localhost,1433 \
              -U sa \
              -P "RaceDayPassword123!" \
              -C \
              -Q "SELECT 1" && break
            echo "SQL Server is not ready yet..."
            sleep 2
          done

      # Step 4: Create database and tables
      - name: Run RaceDay database script
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "RaceDayPassword123!" \
            -C \
            -i database/RaceDay.sql

      # Step 5: Run database tests
      - name: Run database tests
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "RaceDayPassword123!" \
            -C \
            -d RaceDay \
            -i tests/test.sql

      # Step 6: Confirm successful pipeline
      - name: Database CI completed
        run: |
          echo "======================================"
          echo "RaceDay3 Database CI PASSED"
          echo "======================================"
